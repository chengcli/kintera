# Legacy-format conversion: column 0 is now total absorption = old c0 + c1.
# The old c0 is interpreted as the non-dissociating remainder; wavelengths
# and dissociation columns are preserved. This is a format interpretation,
# not a claim of independently established external dataset provenance.
reference-state:
  Tref: 300.
  Pref: 1.e5

species:
  - name: N2
    composition: {N: 2}
    cv_R: 2.5

  - name: O2
    composition: {O: 2}
    cv_R: 2.5

  - name: O
    composition: {O: 1}
    cv_R: 1.5

  - name: O3
    composition: {O: 3}
    cv_R: 3.0

reactions:
  # R1: O + O2 <=> O3 (reversible, Gibbs-based reverse matches VULCAN)
  - equation: O + O2 <=> O3
    type: arrhenius
    rate-constant: {A: 1.7e-14, b: -2.4, Ea_R: 0.0}

  # R2: O + O3 <=> 2 O2 (reversible)
  - equation: O + O3 <=> 2 O2
    type: arrhenius
    rate-constant: {A: 8.0e-12, b: 0.0, Ea_R: 2060.0}

  # R3: O + O2 + M <=> O3 + M (three-body, reversible)
  - equation: O + O2 + M <=> O3 + M
    type: three-body
    rate-constant: {A: 6.0e-34, b: -2.4, Ea_R: 0.0}
    efficiencies: {N2: 1.0, O2: 1.0}

  # P1: O2 => 2 O (photolysis, irreversible — no Gibbs reverse for photolysis)
