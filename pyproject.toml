[build-system]
requires = [
  "setuptools>=61.0.0",
  "setuptools-scm>=8",
  "wheel",
  "build",
  "pyharp>=2.2.0",
  "torch==2.10.0",
  "ninja",
  ]
build-backend = "setuptools.build_meta"

[project]
name = "kintera"
dynamic = ["version"]
description = "Atmospheric Chemistry and Thermodynamics Library"
authors = [
  { name="Cheng Li", email="chengcli@umich.edu" },
  { name="Sihe Chen", email="sihechen@caltech.edu"},
]
license = { text = "LICENSE" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "scipy",
  "pyharp>=2.2.0",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Programming Language :: C",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Scientific/Engineering :: Astronomy",
]

[project.urls]
Homepage = "https://github.com/chengcli/kintera"
Documentation = "https://kintera.readthedocs.io"

[tool.setuptools]
packages = [
  "kintera",
  "kintera.api",
  "kintera.atm2d",
  "kintera.atm2d.conservation",
  "kintera.atm2d.newton",
  "kintera.atm2d.sources",
  "kintera.equilibrium",
  "kintera.kinetics_base",
  "kintera.kinetics_base.titan",
  "kintera.kinetics_base_titan",
]
include-package-data = false

[tool.setuptools.package-data]
"kintera" = [
  "kintera/**/*",
  "data/*.dat",
  "equilibrium/*.yaml",
  "lib/*.so",
  "lib/*.dylib",
  "*.pyi",
  "py.typed",
]

[tool.setuptools_scm]
# Versions come from git tags. A tree without git metadata is handled in order:
# - a `git archive` (release tarballs) carries its `git describe` in
#   .git_archival.txt and gets its exact version;
# - an archive without a describe (git older than 2.32, or no reachable tag)
#   and a plain copied tree report fallback_version, the release floor below.
# scm_version_scheme.py applies the floor on the archive path too, which
# setuptools_scm alone would report as 0.0 (#125).
# fallback_version is the newest release reachable when this line was last
# updated; tests/test_version_floor.py checks it is never ahead of the tags.
fallback_version = "2.5.9"
version_scheme = "scm_version_scheme:floored_guess_next_dev"
